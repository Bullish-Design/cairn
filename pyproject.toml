[project]
name = "cairn"
version = "0.3.0"
description = "Cairn orchestrator runtime for sandboxed code execution on fsdantic workspaces"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Bullish Design" }]
dependencies = [
    "fsdantic>=0.7.0",
    "pydantic>=2.0.0",
    "watchfiles>=0.20.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pathspec>=0.12.0",
]


[project.scripts]
cairn = "cairn.cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.1.0",
    "ty>=0.0.65",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "benchmark: mark test as a performance benchmark",
    "integration: mark test as integration tests",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
]
addopts = [
    "--strict-markers",
    "--verbose",
    # Benchmarks are timing-sensitive and flake under load; deselect them in
    # the default suite (CI / devenv test).  Run explicitly with:
    #   pytest -m benchmark            (environment-tolerant thresholds)
    #   CAIRN_STRICT_BENCHMARKS=1 pytest -m benchmark   (real targets)
    "-m",
    "not benchmark",
]
pythonpath = ["."]

[tool.coverage.run]
source = ["cairn"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv.sources]
fsdantic = { git = "https://github.com/Bullish-Design/fsdantic.git", tag = "v0.7.0" }

[tool.uv]
prerelease = "allow"

[tool.ty]
environment.python-version = "3.13"
src.include = ["src/cairn"]


# Review §2.1: the previous `include = ["src/cairn/py.typed"]` overrides
# restricted both artifacts to a single marker file, shipping no Python
# modules. The wheel must carry the full package and the sdist must be able
# to reproduce it. The wheel's package root is declared explicitly; the
# sdist gets no file-selection overrides (hatchling defaults apply).
[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.hatch.build.targets.sdist]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
