name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  devenv-gate:
    runs-on: ubuntu-latest
    env:
      # The nixos/nix runner image ships with experimental features disabled;
      # on GitHub runners (Determinate installer) these are already enabled,
      # so this is a no-op there.  max-jobs/cores keep any local nix builds
      # (the devenv shell graph) from spawning too many parallel jobs in the
      # container; python and the rest substitute from cache.nixos.org.
      NIX_CONFIG: "experimental-features = nix-command flakes max-jobs = 2 cores = 2"
    steps:
      - uses: actions/checkout@v4

      # GitHub hosted runners do not ship Nix; install it with the Determinate
      # installer + public binary cache.  Locally the workflow is executed by
      # `act` (.actrc maps ubuntu-latest to the nixos/nix image, which already
      # ships Nix), so these two steps are skipped there (act sets ACT=true).
      - name: Install Nix (GitHub runner only)
        if: ${{ !env.ACT }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://install.determinate.systems/nix \
            | sh -s -- install linux --extra-conf "sandbox = false" --no-confirm
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Attach public Nix cache (GitHub runner only)
        if: ${{ !env.ACT }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://install.determinate.systems/magic_r0 \
            | bash -s -- --use-cache

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # The nixos/nix runner image can create /nix/var/nix/builds with
      # permissive permissions when a local build first creates it, which Nix
      # rejects for security.  Pre-create it with safe permissions.
      - name: Prepare nix state directories
        run: |
          mkdir -p /nix/var/nix/builds
          chmod 0755 /nix/var/nix/builds
          ls -ld /nix/var/nix/builds

      # Runs the project's own gate (devenv.nix enterTest): ty check plus the
      # full pytest suite including the real bubblewrap sandbox tests (the
      # sandbox runtime is declared by devenv, so CAIRN_EXECUTOR_* is set).
      - name: Run the devenv gate (ty check + pytest incl. real-sandbox)
        run: |
          # Astral's `ty` ships a prebuilt wheel binary whose PT_INTERP is the
          # distro loader /lib64/ld-linux-x86-64.so.2; the runner image lacks
          # /lib64, so point it at the nix glibc loader before the gate runs.
          mkdir -p /lib64
          nix build --no-link nixpkgs#glibc
          ln -sf "$(nix eval --raw nixpkgs#glibc.outPath)/lib/ld-linux-x86-64.so.2" /lib64/ld-linux-x86-64.so.2
          ls -l /lib64/ld-linux-x86-64.so.2
          devenv ci

      - name: Smoke-test the demo script
        run: uv run python scripts/demo_cairn_library.py

  # Review §2.1: the published artifacts must actually contain the library.
  # Builds the sdist + wheel, installs each into a clean venv (with the
  # git-only fsdantic dependency pinned via a constraints file), verifies the
  # wheel ships the full package and the sdist reproduces it, then runs
  # `import cairn` and both console entry points against each artifact.
  dist-smoke:
    runs-on: ubuntu-latest
    needs: devenv-gate
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes max-jobs = 2 cores = 2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (GitHub runner only)
        if: ${{ !env.ACT }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://install.determinate.systems/nix \
            | sh -s -- install linux --extra-conf "sandbox = false" --no-confirm
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Attach public Nix cache (GitHub runner only)
        if: ${{ !env.ACT }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://install.determinate.systems/magic_r0 \
            | bash -s -- --use-cache

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Prepare nix state directories
        run: |
          mkdir -p /nix/var/nix/builds
          chmod 0755 /nix/var/nix/builds
          ls -ld /nix/var/nix/builds

      - name: Build sdist + wheel and smoke-test both artifacts in clean venvs
        run: |
          devenv shell -- bash -c 'export PATH="$UV_PROJECT_ENVIRONMENT/bin:$PATH" && scripts/smoke-test-dist.sh'

  # Timing-sensitive benchmarks run separately and non-blocking: relaxed
  # thresholds (no CAIRN_STRICT_BENCHMARKS) and continue-on-error so a flaky
  # measurement never blocks merges, while still surfacing regressions.
  benchmarks:
    runs-on: ubuntu-latest
    needs: devenv-gate
    continue-on-error: true
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes max-jobs = 2 cores = 2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (GitHub runner only)
        if: ${{ !env.ACT }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://install.determinate.systems/nix \
            | sh -s -- install linux --extra-conf "sandbox = false" --no-confirm
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Attach public Nix cache (GitHub runner only)
        if: ${{ !env.ACT }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://install.determinate.systems/magic_r0 \
            | bash -s -- --use-cache

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Prepare nix state directories
        run: |
          mkdir -p /nix/var/nix/builds
          chmod 0755 /nix/var/nix/builds
          ls -ld /nix/var/nix/builds

      - name: Run benchmark suite (relaxed thresholds, non-blocking)
        run: |
          devenv shell -- bash -c 'export PATH="$UV_PROJECT_ENVIRONMENT/bin:$PATH" && pytest -m benchmark -q'
